name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ai-sidecar-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ai-sidecar-win32-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: ai-sidecar-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p ai-sidecar --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.asset }}" == *.exe ]]; then
            cp target/${{ matrix.target }}/release/ai-sidecar.exe dist/${{ matrix.asset }}
          else
            cp target/${{ matrix.target }}/release/ai-sidecar dist/${{ matrix.asset }}
          fi
          (cd dist && sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          generate_release_notes: true
