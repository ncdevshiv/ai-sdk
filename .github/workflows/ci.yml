name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  live-gateway:
    runs-on: ubuntu-latest
    needs: [fmt, check-clippy, test]
    # Runs the real gateway suite only when the secrets are present.
    if: ${{ secrets.AI_SDK_GATEWAY_API_KEY != '' }}
    env:
      AI_SDK_GATEWAY_BASE_URL: ${{ secrets.AI_SDK_GATEWAY_BASE_URL }}
      AI_SDK_GATEWAY_API_KEY: ${{ secrets.AI_SDK_GATEWAY_API_KEY }}
      AI_SDK_PRIMARY_MODEL: deepseek-v4-flash
      AI_SDK_VISION_MODEL: mimo-v2.5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ai-providers --test live_gateway -- --test-threads=2
